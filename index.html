<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="Learn Python, HTML and C++ (plus an OpenGL track) from absolute zero — read, study a sample, answer a question. Progress saves to the cloud."
    />

    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LearnCode" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <title>LearnCode</title>

    <!--
      Set the colour theme before the first paint, so a light-theme user never
      sees a flash of the dark default. Mirrors src/lib/theme.tsx exactly:
      a saved choice wins, otherwise the OS preference, otherwise dark.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('learncode.theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          /* first paint just uses the CSS default (dark) */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
